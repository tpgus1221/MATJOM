spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-postgres.sql
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: WARN

jwt:
  secret: test-secret-test-secret-test-secret-32