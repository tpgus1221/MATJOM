spring:
  application:
    name: matjom

  profiles:
    # 활성화할 프로필은 실행 시 --spring.profiles.active=dev 또는 prod 로 지정
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false # 성능/메모리 이슈 방지
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none # 환경별로 덮어쓰기
  jackson:
    time-zone: Asia/Seoul
    
server:
  port: 8080

# 로깅 기본값 (환경별로 override 가능)
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

ratelimit:
  search:
    capacity: 10
    window-seconds: 10

# Swagger 기본값 (운영에서는 꺼야 함)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# 액추에이터 (헬스체크, 메트릭)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
